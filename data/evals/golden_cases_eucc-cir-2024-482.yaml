- id: eucc-cir-2024-482-01-retrieval-certificering
  profile: LEGAL
  test_types:
  - retrieval
  origin: auto
  prompt: Hvad fastsætter forordningen om certificering af IKT-produkter?
  expected:
    allow_empty_references: false
    must_have_article_support_for_normative: true
    must_include_any_of:
    - article:5
    must_not_include_any_of: []
    behavior: answer
    notes: Tester at systemet kan finde den specifikke artikel om certificering af
      IKT-produkter.
